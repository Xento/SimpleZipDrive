name: Validate monitoring branch

on:
  push:
    branches:
      - tmp-monitoring-build-validate
  pull_request:
    branches:
      - multivolume-rar

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          ref: tmp-monitoring-build-validate
          fetch-depth: 0

      - name: Decode monitoring patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = (Get-Content 'monitoring.patch.gz.b64' -Raw).Trim()
          $gzipPath = Join-Path $env:RUNNER_TEMP 'monitoring.patch.gz'
          $patchPath = Join-Path $env:RUNNER_TEMP 'monitoring.patch'
          [IO.File]::WriteAllBytes($gzipPath, [Convert]::FromBase64String($encoded))
          $input = [IO.File]::OpenRead($gzipPath)
          $output = [IO.File]::Create($patchPath)
          try {
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            try { $gzip.CopyTo($output) } finally { $gzip.Dispose() }
          } finally {
            $output.Dispose()
            $input.Dispose()
          }
          "PATCH_PATH=$patchPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare clean base and apply source changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin multivolume-rar
          if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
          git reset --hard origin/multivolume-rar
          if ($LASTEXITCODE -ne 0) { throw 'git reset failed' }
          git clean -fdx
          if ($LASTEXITCODE -ne 0) { throw 'git clean failed' }
          git apply --check "$env:PATCH_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'git apply --check failed' }
          git apply "$env:PATCH_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'git apply failed' }

      - name: Build complete solution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build CSharp_SimpleZipDrive.sln -c Release
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed' }

      - name: Publish one clean source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          if ($LASTEXITCODE -ne 0) { throw 'git add failed' }
          git commit -m 'Add live cache and file operation monitoring'
          if ($LASTEXITCODE -ne 0) { throw 'git commit failed' }
          git push --force origin HEAD:multivolume-rar-monitoring
          if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
