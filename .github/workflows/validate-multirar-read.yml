name: Validate multi-volume RAR read fallback

on:
  pull_request:
    branches:
      - multivolume-rar-monitoring

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build complete solution
        shell: pwsh
        run: dotnet build CSharp_SimpleZipDrive.sln -c Release
